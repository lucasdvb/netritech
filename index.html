<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life OS</title>
  <meta name="description" content="A quiet, local-first personal operating system for habits, health, training and life.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life OS">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('lifeos.theme') || 'system';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
    <main class="main" id="main" tabindex="-1">
      <div class="boot" aria-live="polite">
        <div class="boot-mark" aria-hidden="true"></div>
      </div>
    </main>
  </div>
  <div class="sheet-layer" id="sheets"></div>
  <div class="toast-layer" id="toasts" role="status" aria-live="polite"></div>
  <label class="haptic-switch" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
  <noscript><p class="noscript">Life OS needs JavaScript to run. Everything stays on this device.</p></noscript>
</body>
</html>
