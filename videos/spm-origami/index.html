<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP is vendored locally: the render sandbox cannot reach jsDelivr. -->
    <script src="gsap.min.js"></script>
    <script src="cast.js"></script>
    <script src="origami.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; background: #ffffff; }
      .clip { position: absolute; inset: 0; }
      #stage { display: block; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <svg id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0"
           width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- paper cut-out: a white die-cut margin around each teammate + a soft drop shadow -->
          <filter id="cut" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
            <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="fat" />
            <feFlood flood-color="#ffffff" />
            <feComposite in2="fat" operator="in" result="paper" />
            <feGaussianBlur in="fat" stdDeviation="6" result="blur" />
            <feOffset in="blur" dx="4" dy="8" result="off" />
            <feFlood flood-color="#0D141F" flood-opacity="0.16" />
            <feComposite in2="off" operator="in" result="shadow" />
            <feMerge><feMergeNode in="shadow" /><feMergeNode in="paper" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <!-- die-cut paper with a steel screen-print of the figure: printed on the sheet before a teammate flips up -->
          <filter id="paper" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
            <feMorphology in="SourceAlpha" operator="dilate" radius="11" result="fat2" />
            <feFlood flood-color="#43617A" flood-opacity="0.55" />
            <feComposite in2="fat2" operator="in" result="edge" />
            <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="fat" />
            <feFlood flood-color="#ffffff" />
            <feComposite in2="fat" operator="in" result="paper" />
            <feColorMatrix in="SourceAlpha" type="matrix" values="0 0 0 0 0.263  0 0 0 0 0.380  0 0 0 0 0.478  0 0 0 0.42 0" result="print" />
            <feGaussianBlur in="fat" stdDeviation="6" result="blur" />
            <feOffset in="blur" dx="4" dy="8" result="off" />
            <feFlood flood-color="#0D141F" flood-opacity="0.14" />
            <feComposite in2="off" operator="in" result="shadow" />
            <feMerge><feMergeNode in="shadow" /><feMergeNode in="edge" /><feMergeNode in="paper" /><feMergeNode in="print" /></feMerge>
          </filter>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" /></filter>
        </defs>
        <g id="world"></g>
      </svg>
    </div>
    <script>
      // The film is a pure function of time (ORIGAMI.paint). GSAP owns the clock: a single linear tween
      // drives a setter, so every runtime seek repaints exactly that frame (setters run even when the
      // seek suppresses callbacks).
      let now = -1;
      const clock = {
        time(v) {
          if (v === undefined) return now;
          now = v;
          window.ORIGAMI.paint(v);
        },
      };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { time: 0 }, { time: 10, duration: 10, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
