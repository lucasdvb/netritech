<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SPM Agent Shadows 3D</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.js",
          "three/addons/": "./assets/vendor/three/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Bricolage";
        src: url("assets/bricolage.woff2") format("woff2");
        font-weight: 200 800;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020202; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Bricolage", sans-serif; }
      #gl, #fx, #first, #last { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #first, #last { object-fit: cover; }
      #last { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <canvas id="gl" width="1920" height="1080"></canvas>
        <canvas id="fx" width="1920" height="1080"></canvas>
        <img id="first" src="assets/first-frame.jpg" alt="" />
        <img id="last" src="assets/last-frame.png" alt="" />
      </div>
    </div>
    <script>
      // The GSAP clock drives the deterministic 3D renderer (assets/film3d.js).
      const clock = { t: 0 };
      const tl = gsap.timeline({
        paused: true,
        onUpdate: () => { window.__spmT = tl.time(); if (window.__spmRender) window.__spmRender(tl.time()); },
      });
      tl.to(clock, { t: 8, duration: 8, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="assets/film3d.js"></script>
  </body>
</html>
